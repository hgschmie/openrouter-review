name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:cli
        id: cli
      - name: Test compiled CLI
        run: node --test tests/cli.test.ts
        env:
          OR_REVIEW_BINARY: ${{ steps.cli.outputs.executable }}
      - name: Upload CLI archive and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: or-review-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/*.tar.gz
            artifacts/*.sha256
          if-no-files-found: error
